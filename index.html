<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            background: #1677ff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .navbar h2 {
            font-size: 25px;
        }

        .add-btn {
            border: 0;
            background: white;
            color: #1677ff;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 32px;
        }

        .welcome p {
            color: #777;
            margin-top: 7px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .07);
        }

        .card h3 {
            color: #777;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 35px;
            color: #1677ff;
        }

        .card:nth-child(2) h2 {
            color: #d46b08;
        }

        .card:nth-child(3) h2 {
            color: #389e0d;
        }

        .todo-section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .07);
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 15px;
            text-align: left;
            background: #fafafa;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff7e6;
            color: #d46b08;
        }

        .progress {
            background: #e6f4ff;
            color: #1677ff;
        }

        .completed {
            background: #f6ffed;
            color: #389e0d;
        }

        .edit-btn,
        .delete-btn {
            border: 0;
            padding: 8px 11px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background: #1677ff;
            color: white;
        }

        .delete-btn {
            background: #ff4d4f;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
        }

        .modal-box h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .save-btn,
        .cancel-btn {
            flex: 1;
            border: 0;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn {
            background: #1677ff;
            color: white;
        }

        .cancel-btn {
            background: #eee;
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 20px;
            }

            .todo-section {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Todo Dashboard</h2>
        <button class="add-btn" onclick="openModal()">+ Add Todo</button>
    </div>

    <div class="container">

        <div class="welcome">
            <h1>Dashboard</h1>
            <p>Your real Firebase Todos</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Todos</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <h2 id="pending">0</h2>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <h2 id="completed">0</h2>
            </div>

        </div>

        <div class="todo-section">

            <div class="todo-header">
                <h2>My Todos</h2>
                <button class="add-btn" onclick="openModal()">+ Add Todo</button>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="todoTable"></tbody>

            </table>

            <div id="empty" class="empty">
                No Todos in Firebase
            </div>

        </div>

    </div>


    <div class="modal" id="modal">

        <div class="modal-box">

            <h2 id="formTitle">Add Todo</h2>

            <label>Title</label>
            <input id="title" type="text" placeholder="Todo title">

            <label>Description</label>
            <textarea id="description" placeholder="Todo description"></textarea>

            <label>Status</label>

            <select id="status">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>
            </select>

            <div class="modal-buttons">
                <button class="save-btn" onclick="saveTodo()">Save</button>
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            updateDoc,
            deleteDoc,
            doc
        }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "YOUR_API_KEY",

            authDomain: "YOUR_PROJECT.firebaseapp.com",

            projectId: "YOUR_PROJECT_ID",

            storageBucket: "YOUR_PROJECT.firebasestorage.app",

            messagingSenderId: "YOUR_SENDER_ID",

            appId: "YOUR_APP_ID"

        };


        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const todosRef = collection(db, "todos");


        let editingId = null;


        window.openModal = function () {

            editingId = null;

            document.getElementById("formTitle").innerText =
                "Add Todo";

            document.getElementById("title").value = "";

            document.getElementById("description").value = "";

            document.getElementById("status").value =
                "Pending";

            document.getElementById("modal").style.display =
                "flex";
        };


        window.closeModal = function () {

            document.getElementById("modal").style.display =
                "none";

        };


        window.saveTodo = async function () {

            const title =
                document.getElementById("title").value.trim();

            const description =
                document.getElementById("description").value.trim();

            const status =
                document.getElementById("status").value;


            if (!title || !description) {

                alert("Please fill all fields");

                return;
            }


            try {

                if (editingId === null) {

                    await addDoc(todosRef, {

                        title: title,

                        description: description,

                        status: status

                    });

                    alert("Todo added successfully!");

                } else {

                    await updateDoc(
                        doc(db, "todos", editingId),
                        {
                            title: title,
                            description: description,
                            status: status
                        }
                    );

                    alert("Todo updated successfully!");

                }


                closeModal();

            } catch (error) {

                console.error(error);

                alert("Firebase Error: " + error.message);

            }

        };


        window.editTodo = function (
            id,
            title,
            description,
            status
        ) {

            editingId = id;

            document.getElementById("formTitle").innerText =
                "Edit Todo";

            document.getElementById("title").value =
                title;

            document.getElementById("description").value =
                description;

            document.getElementById("status").value =
                status;

            document.getElementById("modal").style.display =
                "flex";

        };


        window.deleteTodo = async function (id) {

            if (!confirm("Delete this Todo?")) {
                return;
            }


            try {

                await deleteDoc(
                    doc(db, "todos", id)
                );

                alert("Todo deleted successfully!");

            } catch (error) {

                console.error(error);

                alert("Firebase Error: " + error.message);

            }

        };


        /*
            REAL-TIME FIREBASE LISTENER
        
            This is the important part.
        
            Whenever a Todo is added,
            edited or deleted in Firebase,
            Dashboard changes automatically.
        */

        onSnapshot(
            todosRef,
            (snapshot) => {

                const table =
                    document.getElementById("todoTable");

                const empty =
                    document.getElementById("empty");


                table.innerHTML = "";


                let total = 0;

                let pending = 0;

                let completed = 0;


                snapshot.forEach((item) => {

                    const todo = item.data();

                    total++;


                    if (todo.status === "Pending") {
                        pending++;
                    }


                    if (todo.status === "Completed") {
                        completed++;
                    }


                    const row =
                        document.createElement("tr");


                    const title =
                        document.createElement("td");

                    title.textContent =
                        todo.title || "";


                    const description =
                        document.createElement("td");

                    description.textContent =
                        todo.description || "";


                    const status =
                        document.createElement("td");


                    const badge =
                        document.createElement("span");

                    badge.className =
                        "status";


                    if (todo.status === "Completed") {

                        badge.classList.add("completed");

                    } else if (todo.status === "In Progress") {

                        badge.classList.add("progress");

                    } else {

                        badge.classList.add("pending");

                    }


                    badge.textContent =
                        todo.status || "Pending";


                    status.appendChild(badge);


                    const actions =
                        document.createElement("td");


                    const edit =
                        document.createElement("button");

                    edit.className =
                        "edit-btn";

                    edit.textContent =
                        "✏️";

                    edit.onclick = function () {

                        editTodo(
                            item.id,
                            todo.title || "",
                            todo.description || "",
                            todo.status || "Pending"
                        );

                    };


                    const remove =
                        document.createElement("button");

                    remove.className =
                        "delete-btn";

                    remove.textContent =
                        "🗑️";

                    remove.onclick = function () {

                        deleteTodo(item.id);

                    };


                    actions.appendChild(edit);

                    actions.appendChild(remove);


                    row.appendChild(title);

                    row.appendChild(description);

                    row.appendChild(status);

                    row.appendChild(actions);


                    table.appendChild(row);

                });


                document.getElementById("total").textContent =
                    total;

                document.getElementById("pending").textContent =
                    pending;

                document.getElementById("completed").textContent =
                    completed;


                if (total === 0) {

                    empty.style.display =
                        "block";

                } else {

                    empty.style.display =
                        "none";

                }

            },

            (error) => {

                console.error(error);

                alert(
                    "Firebase connection error: " +
                    error.message
                );

            }
        );

    </script>

</body>

</html>
